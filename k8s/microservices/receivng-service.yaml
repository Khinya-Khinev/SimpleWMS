apiVersion: v1
kind: ConfigMap
metadata:
  name: receiving-service-config
data:
  SPRING_PROFILES_ACTIVE: "dev"

  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-receiving-svc:5432/receiving_db"
  SPRING_DATASOURCE_USERNAME: "receiving_user"

  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://auth-service:9000"

  # Redis connection pointing to internal Redis service
#  SPRING_REDIS_HOST: "redis"
#  SPRING_REDIS_PORT: "6379"

---

apiVersion: v1
kind: Secret
metadata:
  name: receiving-service-secret
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "receiving_pass"
#  SPRING_REDIS_PASSWORD: "redis-pass"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiving-service-deployment
spec:
  replicas: 1
  selector:                         # telling deployment to manage only pods with this label
    matchLabels:
      app: receiving-service        # MUST match template.metadata.labels below
  template:                         # a blueprint for pods
    metadata:
      labels:
        app: receiving-service      # Stamped onto the Pod
    spec:
      containers:
        - name: receiving-service
          image: receiving-service:v1  # Your local docker image name
          imagePullPolicy: IfNotPresent # Uses your local image in Minikube
          ports:
            - containerPort: 8080        # Port your app listens on inside container

          envFrom:
            - configMapRef:
                name: receiving-service-config
            - secretRef:
                name: receiving-service-secret

---

apiVersion: v1
kind: Service
metadata:
  name: receiving-service           # Other pods call "http://receiving-service:8080"
spec:
  type: ClusterIP
  selector:
    app: receiving-service          # so its just says which podes are under control of service
  ports:
    - port: 8080                    # port to connect to the service
      targetPort: 8080              # port inside the pod